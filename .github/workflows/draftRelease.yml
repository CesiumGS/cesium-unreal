name: Draft Release
on:
  push:
    branches: [draft-release-workflow]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.30.0"
        required: true
        type: string
      source_branch:
        description: "Branch whose build artifacts should be published"
        required: false
        default: "main"
        type: string
      run_id:
        description: "Build run ID to publish. Defaults to the latest successful build of the source branch."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Preview the build, packages, notes, and release actions without downloading packages or changing releases"
        required: false
        default: false
        type: boolean

jobs:
  DraftRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      RUN_ID_INPUT: ${{ inputs.run_id }}
      DRY_RUN: ${{ inputs.dry_run }}
      # Keep in sync with the Combine* jobs in build.yml.
      UNREAL_VERSIONS: "56 57 58"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected X.Y.Z, for example 2.30.0."
            exit 1
          fi
